# WebDAV 测试站点。
#
#   http://host:8084/dav        → Digest 认证（FR-1.5 P1 的唯一验证环境）
#   http://host:8084/dav-basic  → Basic 认证（与 Nextcloud 之外的第二个 Basic 实现交叉验证）
#   https://host:8443/dav-basic → 自签名 TLS（NFR-2.3）
#
# realm 必须与 Dockerfile 中生成 htdigest 时使用的 DAV_REALM 一致。

DavLockDB /usr/local/apache2/var/DavLock

Alias /dav /var/www/webdav
Alias /dav-basic /var/www/webdav

<Directory /var/www/webdav>
    Options Indexes
    AllowOverride None
    Require all granted
</Directory>

<Location /dav>
    Dav On
    AuthType Digest
    AuthName "webdav-test"
    AuthDigestProvider file
    AuthUserFile /usr/local/apache2/conf/dav.htdigest
    Require valid-user
</Location>

<Location /dav-basic>
    Dav On
    AuthType Basic
    AuthName "webdav-test-basic"
    AuthUserFile /usr/local/apache2/conf/dav.htpasswd
    Require valid-user
</Location>

# ── 自签名 TLS 端点（NFR-2.3）──
Listen 443

<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /usr/local/apache2/conf/server.crt
    SSLCertificateKeyFile /usr/local/apache2/conf/server.key

    Alias /dav-basic /var/www/webdav

    <Location /dav-basic>
        Dav On
        AuthType Basic
        AuthName "webdav-test-basic"
        AuthUserFile /usr/local/apache2/conf/dav.htpasswd
        Require valid-user
    </Location>
</VirtualHost>
